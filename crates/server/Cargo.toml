[package]
name = "server"
version = "0.1.0"
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[features]
# On by default so local `spacetime publish` keeps the dev shortcuts.
default = ["dev"]
dev = []

[dependencies]
spacetimedb = { version = "2.8.3" }
log = "0.4"
